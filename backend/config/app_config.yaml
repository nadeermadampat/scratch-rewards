# Non-sensitive application settings. Secrets belong in `.env`.

scratch_card:
  expiry_hours: 72          # how long a generated card stays valid
  reveal_threshold: 0.5     # fraction of the coating scratched before auto-reveal
  max_cards_per_user: 1     # per campaign

verification:
  token_ttl_minutes: 15     # lifetime of the one-time token returned by /subscriptions/verify

# Per-client-IP sliding windows. Remove a bucket to disable limiting for it.
rate_limits:
  verify:      { limit: 10,  window_seconds: 60 }
  issue_card:  { limit: 10,  window_seconds: 60 }
  card_read:   { limit: 120, window_seconds: 60 }
  card_write:  { limit: 30,  window_seconds: 60 }
  admin:       { limit: 120, window_seconds: 60 }

# Social media providers. `verification_mode`: simulated | oauth
providers:
  youtube:   { enabled: true,  verification_mode: simulated }
  instagram: { enabled: false }
  facebook:  { enabled: false }
  tiktok:    { enabled: false }

# Demonstration data loaded by `python -m app.seed`.
